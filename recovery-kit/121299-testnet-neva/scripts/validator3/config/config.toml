# HARA Ledger Testnet — validator3 (1 dari 3 validator; lihat validator1/config/config.toml
# untuk penjelasan lengkap kenapa 3 validator, bukan 1)

profile="ENTERPRISE"
network-id=121299
genesis-file="/config/genesis.json"
data-path="/data"
sync-mode="SNAP"
sync-min-peers=0

rpc-http-enabled=true
rpc-http-host="127.0.0.1"
rpc-http-port=5797
rpc-http-api=["ETH","NET","QBFT","TXPOOL","WEB3","ADMIN","DEBUG"]
host-allowlist=["localhost","127.0.0.1"]
rpc-http-max-active-connections=200
rpc-ws-enabled=true
rpc-ws-host="127.0.0.1"
rpc-ws-port=5798
rpc-ws-max-active-connections=80

rpc-tx-feecap=0
min-gas-price=0
strict-tx-replay-protection-enabled=true

tx-pool="sequenced"
tx-pool-max-size=5000
tx-pool-limit-by-account-percentage=1.0
tx-pool-retention-hours=1

target-gas-limit=10000000000

p2p-port=30305
discovery-enabled=false
max-peers=10

data-storage-format="BONSAI"
bonsai-historical-block-limit=512
bonsai-limit-trie-logs-enabled=true

metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9547
metrics-category=["BLOCKCHAIN","ETHEREUM","EXECUTORS","JVM","PROCESS","TRANSACTION_POOL"]

logging="INFO"
