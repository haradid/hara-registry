name: hara-tesnet-validator3

services:
  besu:
    image: ${BESU_IMAGE}
    container_name: hara-tesnet-validator3
    restart: unless-stopped
    network_mode: host
    mem_limit: 1600m
    memswap_limit: 1600m
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - ./config/config.toml:/config/config.toml:ro
      - ./config/static-nodes.json:/config/static-nodes.json:ro
      - ../keys/nodekey3:/keys/nodekey:ro
      - ./data:/data
    environment:
      BESU_OPTS: ${BESU_HEAP_OPTS}
    command:
      - --config-file=/config/config.toml
      - --p2p-host=${P2P_HOST}
      - --node-private-key-file=/keys/nodekey
      - --static-nodes-file=/config/static-nodes.json
      - --ethstats=ws://validator3:${NETSTATS_SECRET}@<TESTNET_HOSTA_IP>:3001
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9547 && echo ok'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
